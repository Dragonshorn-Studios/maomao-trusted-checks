rules:
  - id: maomao.python-eval-exec
    languages: [python]
    severity: ERROR
    message: Avoid eval/exec on dynamically controlled input.
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
  - id: maomao.child-process-shell-exec
    languages: [javascript, typescript]
    severity: ERROR
    message: Review child_process shell execution for dynamically controlled commands.
    pattern-either:
      - pattern: child_process.exec(...)
      - pattern: exec(...)
